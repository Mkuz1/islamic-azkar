# Deploys website/ to Cloudflare Pages (project "islamic-azkar", production branch "main"),
# so the site can be published from GitHub instead of from the Mac.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – API token with "Cloudflare Pages: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID  – the Cloudflare account ID
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main, "main-*"]
    paths: ["website/**", ".github/workflows/website.yml"]

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then re-run this workflow."
            exit 1
          fi
      - name: Check the azkar data
        run: python3 -c "import json; d=json.load(open('website/data/azkar.json')); print(len(d['chapters']), 'chapters,', len(d.get('guides', [])), 'guide(s)')"
      - name: Version the script and style links
        # Cloudflare's browser cache can keep app.js / style.css for hours after a deploy; a
        # version in the link makes browsers fetch the new files at once.
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"(style\.css|app\.js|prayer\.js)\"#\1=\"\2?v=$V\"#g" website/index.html
          grep -E "\?v=$V" website/index.html
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch main publishes to production (islamicazkar.net) whichever git branch this runs on.
        # Run inside website/ so wrangler.toml (the KV binding for the /sync function) is used.
        working-directory: website
        run: npx --yes wrangler@3.114.0 pages deploy . --project-name islamic-azkar --branch main --commit-dirty=true
      - name: Smoke test
        run: |
          sleep 20
          curl -fsS "https://islamicazkar.net/data/azkar.json?check=$GITHUB_RUN_ID" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('guides'), 'live site has no Umrah guide yet'; print('live:', len(d['chapters']), 'chapters')"
          # The live page links this deploy's script, and that script has the newest features.
          V=${GITHUB_SHA::8}
          curl -fsS "https://islamicazkar.net/?check=$GITHUB_RUN_ID" | grep -q "app.js?v=$V" || { echo "::error::islamicazkar.net does not serve this deploy's page yet"; exit 1; }
          curl -fsS "https://islamicazkar.net/app.js?v=$V" | grep -q "function record()" && echo "live app.js: $V"
          # Sync between devices: create a code, then sync with it.
          NEW=$(curl -sS -X POST https://islamicazkar.net/sync/new -H 'content-type: application/json' -d '{"days":{}}')
          echo "sync/new: $NEW"
          CODE=$(echo "$NEW" | python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          curl -sS -X POST https://islamicazkar.net/sync -H 'content-type: application/json' -d "{\"code\":\"$CODE\",\"days\":{\"2026-01-01\":[\"morning\"]}}" | tee /dev/stderr | grep -q '2026-01-01'
