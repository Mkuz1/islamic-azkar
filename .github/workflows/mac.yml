# Builds the Mac app (menu bar prayer times and azkar reminder) on a GitHub-hosted Mac:
#  - IslamicAzkar.dmg (ad-hoc signed, universal: Apple silicon and Intel)
# (GitHub's Mac runners give apps no usable window session, so there are no screenshots.)
name: Mac

on:
  workflow_dispatch:
  push:
    branches: [main, "main-*"]
    paths: ["IslamicAzkar/ios/App/**", "IslamicAzkar/ios/Shared/**", "IslamicAzkar/mac/**", ".github/workflows/mac.yml"]

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: IslamicAzkar/mac
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project IslamicAzkarMac.xcodeproj -scheme IslamicAzkar -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build build | xcbeautify --renderer github-actions
          APP="build/Build/Products/Release/Islamic Azkar.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          lipo -archs "$APP/Contents/MacOS/Islamic Azkar"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist"
          mkdir -p ../../out && ./make_dmg.sh "$APP" ../../out/IslamicAzkar.dmg
          ls -lh ../../out
      - name: Launch check (the app must start, draw its window and the menu bar panel, then quit)
        run: |
          APP="build/Build/Products/Release/Islamic Azkar.app"
          mkdir -p shots
          check() { # name screen lang [extra args]
            n=$1; sc=$2; l=$3; shift 3
            "$APP/Contents/MacOS/Islamic Azkar" -ciScreen "$sc" -ciLang "$l" -ciShot "$PWD/shots/$n.png" -ciTrace 1 "$@" > "shots/$n.log" 2>&1 &
            PID=$!
            for i in $(seq 1 25); do kill -0 $PID 2>/dev/null || break; sleep 1; done
            if kill -0 $PID 2>/dev/null; then
              echo "::error::$n: the app did not finish launching (main thread stack below)"
              sample $PID 2 -file "shots/$n.sample.txt" > /dev/null 2>&1 || true
              grep -A60 "main-thread\|DispatchQueue_1" "shots/$n.sample.txt" | cut -c1-200 | head -60
              kill $PID; cat "shots/$n.log"; return 1
            fi
            [ -s "shots/$n.png" ] || { echo "::error::$n: no window was drawn"; cat "shots/$n.log"; return 1; }
            echo "$n: launched and drew $(sips -g pixelWidth -g pixelHeight "shots/$n.png" | tail -2 | awk '{print $2}' | paste -sd x -)"
          }
          check menu-en home en -ciMenu 1
          check home-ar home ar
          check guide-fr guide fr
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: IslamicAzkar-dmg
          retention-days: 3
          path: out/IslamicAzkar.dmg
