# Builds both Android flavors on GitHub (no Android SDK is needed locally to check a change):
#  - play:   the Google Play build (no self-update code, no REQUEST_INSTALL_PACKAGES)
#  - github: the APK for GitHub releases, which can update itself
# These are debug-signed; release APKs/bundles are signed on the Mac with the upload key.
name: Android

on:
  workflow_dispatch:
  push:
    branches: [main, "main-*"]
    paths: ["IslamicAzkar/app/**", "IslamicAzkar/*.kts", "IslamicAzkar/gradle/**", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: IslamicAzkar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34-ext12" "build-tools;35.0.1" > /dev/null
      - name: Build
        run: ./gradlew --no-daemon assemblePlayDebug assembleGithubDebug testPlayDebugUnitTest --tests '*PrayerCalcTest*'
      - name: Screenshots of the tabs (pushed to the android-shots branch for review)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew --no-daemon testPlayDebugUnitTest -Proborazzi.test.record=true --tests '*ScreenshotTest.record*' --tests '*ScreenshotTest.widgetsTab*' --tests '*ScreenshotTest.settings' --tests '*ScreenshotTest.homeArLight' --tests '*ScreenshotTest.tv*' || true
          ls app/build/shots || exit 0
          mkdir -p /tmp/ashots && cp app/build/shots/*.png /tmp/ashots/ && cp app/build/shots/*.txt /tmp/ashots/ 2>/dev/null || true
          cd /tmp/ashots && git init -q && git checkout -q -b android-shots && git add . \
            && git -c user.name=ci -c user.email=ci@localhost commit -qm "Android screenshots ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-shots && echo "pushed" || true
      - name: Check permissions per flavor
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.1/aapt2"
          PLAY=$(ls app/build/outputs/apk/play/debug/*.apk); GH=$(ls app/build/outputs/apk/github/debug/*.apk)
          "$AAPT2" dump permissions "$PLAY"; "$AAPT2" dump permissions "$GH"
          if "$AAPT2" dump permissions "$PLAY" | grep -q REQUEST_INSTALL_PACKAGES; then echo "::error::Play build must not request REQUEST_INSTALL_PACKAGES"; exit 1; fi
          "$AAPT2" dump permissions "$GH" | grep -q REQUEST_INSTALL_PACKAGES
          "$AAPT2" dump badging "$GH" | head -1
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-debug-apks
          retention-days: 3
          path: IslamicAzkar/app/build/outputs/apk/*/debug/*.apk
