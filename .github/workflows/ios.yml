# Builds the iPhone app on a GitHub-hosted Mac (this Mac has no Xcode):
#  - an unsigned IslamicAzkar.ipa (install with Sideloadly/AltStore, which sign it with your Apple ID)
#  - Simulator screenshots of each screen, to check the design.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main, "main-*"]
    paths: ["IslamicAzkar/ios/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: IslamicAzkar/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      - name: Build for the Simulator
        run: |
          set -o pipefail
          xcodebuild -project IslamicAzkar.xcodeproj -scheme IslamicAzkar -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

      - name: Simulator screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          phones=[x for x in d[ios[-1]] if x["name"].startswith("iPhone") and "Pro Max" not in x["name"]]
          pro=[x for x in phones if x["name"].endswith("Pro")]
          print((pro or phones)[-1]["udid"])')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          APP=$(ls -d build/sim/Build/Products/Debug-iphonesimulator/IslamicAzkar.app)
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p shots
          ./ci_screens.sh "$DEVICE" shots
          # The opening page must fit every screen: the smallest iPhone (SE) and an iPad too.
          for kind in SE iPad; do
            OTHER=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          kind=sys.argv[1]
          d=json.load(sys.stdin)["devices"]
          ios=sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          m=[x for x in d[ios[-1]] if (kind in x["name"] if kind=="SE" else x["name"].startswith("iPad"))]
          print(m[0]["udid"] if m else "")' "$kind")
            [ -n "$OTHER" ] || { echo "no $kind simulator"; continue; }
            xcrun simctl boot "$OTHER" || true
            xcrun simctl bootstatus "$OTHER" -b
            xcrun simctl install "$OTHER" "$APP"
            for l in en ar fr; do
              xcrun simctl terminate "$OTHER" com.koussa.IslamicAzkar >/dev/null 2>&1 || true
              xcrun simctl launch "$OTHER" com.koussa.IslamicAzkar -ciScreen dedication -ciLang $l -ciDark 1 -ciScroll none >/dev/null
              sleep 9
              xcrun simctl io "$OTHER" screenshot "shots/40-dedication-$kind-$l.png" >/dev/null && echo "saved dedication $kind $l"
            done
            xcrun simctl shutdown "$OTHER" || true
          done
          # Screenshots go to the "ios-shots" branch (artifact storage is full), to review the layout.
          mkdir -p /tmp/iosshots
          for f in shots/*.png; do sips -s format jpeg -s formatOptions 60 -Z 1400 "$f" --out "/tmp/iosshots/$(basename "${f%.png}").jpg" > /dev/null; done
          (cd /tmp/iosshots && git init -q && git checkout -q -b ios-shots && git add . \
            && git -c user.name=ci -c user.email=ci@localhost commit -qm "iOS screenshots ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-shots && echo "screenshots pushed to ios-shots") || true

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild -project IslamicAzkar.xcodeproj -scheme IslamicAzkar -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcbeautify --renderer github-actions
          rm -rf Payload && mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/IslamicAzkar.app Payload/
          zip -qry IslamicAzkar.ipa Payload
          ls -lh IslamicAzkar.ipa

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: screenshots
          retention-days: 3
          path: IslamicAzkar/ios/shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: IslamicAzkar-ipa
          retention-days: 3
          path: IslamicAzkar/ios/IslamicAzkar.ipa
