# Uploads the iPhone / iPad app to App Store Connect (TestFlight, then submit for review there).
# Triggered by changing store/appstore/UPLOAD (or by hand from the Actions tab).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_TEAM_ID     – the Team ID of the Apple Developer account (developer.apple.com → Membership)
#   APPSTORE_KEY_ID      – App Store Connect API key ID     } App Store Connect → Users and Access →
#   APPSTORE_ISSUER_ID   – its Issuer ID                    } Integrations → App Store Connect API →
#   APPSTORE_KEY_P8      – the downloaded AuthKey_XXXX.p8 file's contents (role: Admin)
# Signing is automatic: Xcode creates the distribution certificate, App IDs, App Group and
# profiles with the API key, so no certificate files are needed.
name: App Store

on:
  workflow_dispatch:
  push:
    branches: [main, "main-*"]
    paths: ["store/appstore/UPLOAD"]

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: IslamicAzkar/ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: $GITHUB_WORKSPACE/tools/select_xcode.sh
      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPSTORE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          for v in TEAM KEY_ID ISSUER P8; do [ -n "${!v}" ] || { echo "::error::Add the App Store secrets (see the top of .github/workflows/appstore.yml)."; exit 1; }; done
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
      - name: Archive (App Store build)
        env:
          TEAM: ${{ secrets.APPSTORE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          # Each upload needs a new build number: the version's build number plus this workflow's run.
          BASE=$(grep -m1 "CURRENT_PROJECT_VERSION = " IslamicAzkar.xcodeproj/project.pbxproj | grep -o "[0-9]*")
          BUILD="$BASE.${{ github.run_number }}"
          echo "build $BUILD"
          xcodebuild archive -project IslamicAzkar.xcodeproj -scheme IslamicAzkar -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/IslamicAzkar.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) APPSTORE' \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | xcbeautify --renderer github-actions
      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPSTORE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions-AppStore.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/IslamicAzkar.xcarchive \
            -exportOptionsPlist ExportOptions-AppStore.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | xcbeautify --renderer github-actions
          echo "Uploaded. It appears in App Store Connect → TestFlight after Apple finishes processing (10-30 min)."
