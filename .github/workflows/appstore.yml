# Uploads the iPhone / iPad app to App Store Connect (TestFlight, then submit for review there).
# Triggered by changing store/appstore/UPLOAD (or by hand from the Actions tab).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_TEAM_ID     – the Team ID of the Apple Developer account (developer.apple.com → Membership)
#   APPSTORE_KEY_ID      – App Store Connect API key ID     } App Store Connect → Users and Access →
#   APPSTORE_ISSUER_ID   – its Issuer ID                    } Integrations → App Store Connect API →
#   APPSTORE_KEY_P8      – the downloaded AuthKey_XXXX.p8 file's contents (role: Admin)
# Signing is automatic: Xcode creates the distribution certificate, App IDs, App Group and
# profiles with the API key, so no certificate files are needed.
name: App Store

on:
  workflow_dispatch:
  push:
    branches: [main, "main-*"]
    paths: ["store/appstore/UPLOAD"]

permissions:
  contents: read

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: IslamicAzkar/ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: $GITHUB_WORKSPACE/tools/select_xcode.sh
      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPSTORE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          for v in TEAM KEY_ID ISSUER P8; do [ -n "${!v}" ] || { echo "::error::Add the App Store secrets (see the top of .github/workflows/appstore.yml)."; exit 1; }; done
          # Pasted secrets can carry spaces or line breaks; Apple's tools reject those.
          for v in TEAM KEY_ID ISSUER; do
            clean=$(printf '%s' "${!v}" | tr -d '[:space:]')
            echo "::add-mask::$clean"
            echo "$v=$clean" >> "$GITHUB_ENV"
            [ "$clean" = "${!v}" ] || echo "note: removed spaces / line breaks around $v"
          done
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$P8" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
      - name: Check the API key with Apple (shows what is wrong, never the secrets)
        run: |
          python3 -m pip install -q --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install -q pyjwt cryptography
          python3 - <<'PY'
          import os, re, sys, time, json, urllib.request, urllib.error, jwt
          kid, iss, team = os.environ["KEY_ID"].strip(), os.environ["ISSUER"].strip(), os.environ["TEAM"].strip()
          path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{os.environ['KEY_ID']}.p8")
          key = open(path).read()
          print("Key ID: %d characters%s" % (len(kid), "" if re.fullmatch(r"[A-Z0-9]{10}", kid) else "  <-- should be 10 capital letters/digits"))
          print("Issuer ID: %s" % ("looks right (UUID)" if re.fullmatch(r"[0-9a-f-]{36}", iss) else "NOT a UUID  <-- copy the Issuer ID shown above the key list"))
          print("Team ID: %s" % ("looks right" if re.fullmatch(r"[A-Z0-9]{10}", team) else "should be 10 capital letters/digits"))
          ok_pem = "-----BEGIN PRIVATE KEY-----" in key and "-----END PRIVATE KEY-----" in key
          print("Key file: %s" % ("has BEGIN/END lines" if ok_pem else "missing the BEGIN/END PRIVATE KEY lines  <-- paste the whole .p8 file"))
          def call(url):
              tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                               key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")
          try:
              st, body = call("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.koussa.IslamicAzkar")
          except Exception as e:
              print("::error::The key could not be used to sign a request:", type(e).__name__, e); sys.exit(1)
          print("Apple answered:", st)
          if st != 200:
              for err in body.get("errors", []): print(" -", err.get("title"), "-", err.get("detail"))
              print("::error::Apple rejected the API key (%d). Check that Key ID, Issuer ID and the .p8 file all belong to the same Team key (not an Individual key)." % st)
              sys.exit(1)
          apps = body.get("data", [])
          print("App record for com.koussa.IslamicAzkar:", "found - " + apps[0]["attributes"]["name"] if apps else "NOT FOUND  <-- create it in App Store Connect (New App)")
          st, b2 = call("https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=com.koussa.IslamicAzkar,com.koussa.IslamicAzkar.Widgets")
          print("Registered bundle IDs:", [d["attributes"]["identifier"] for d in b2.get("data", [])] if st == 200 else st)
          if not apps: sys.exit(1)
          PY
      - name: Signing (certificate and App Store profiles made with the API key)
        run: |
          python3 $GITHUB_WORKSPACE/tools/appstore_signing.py setup "$RUNNER_TEMP/sign"
          # Manual signing with those profiles for the app and the widgets.
          python3 - "$RUNNER_TEMP/sign/profiles.json" <<'PY'
          import json, os, re, sys
          names = json.load(open(sys.argv[1])); team = os.environ["TEAM"].strip()
          p = "IslamicAzkar.xcodeproj/project.pbxproj"; s = open(p).read()
          def fix(m):
              block = m.group(0)
              bid = re.search(r"PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);", block)
              if not bid or bid.group(1) not in names: return block
              block = block.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
              block = re.sub(r"DEVELOPMENT_TEAM = [^;]+;", f"DEVELOPMENT_TEAM = {team};", block)
              extra = f'PROVISIONING_PROFILE_SPECIFIER = "{names[bid.group(1)]}";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n\t\t\t\t'
              return block.replace("buildSettings = {\n\t\t\t\t", "buildSettings = {\n\t\t\t\t" + extra, 1)
          s, n = re.subn(r"buildSettings = \{.*?\n\t\t\t\};", fix, s, flags=re.S)
          open(p, "w").write(s)
          print("signing set for", sum(1 for b in re.findall(r"PROVISIONING_PROFILE_SPECIFIER", s)), "configurations")
          PY
      - name: Archive (App Store build)
        run: |
          set -o pipefail
          # Each upload needs a new build number: the version's build number plus this workflow's run.
          BASE=$(grep -m1 "CURRENT_PROJECT_VERSION = " IslamicAzkar.xcodeproj/project.pbxproj | grep -o "[0-9]*")
          BUILD="$BASE.${{ github.run_number }}"
          echo "build $BUILD"
          xcodebuild archive -project IslamicAzkar.xcodeproj -scheme IslamicAzkar -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/IslamicAzkar.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD" SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) APPSTORE' \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/sign/signing.keychain-db" | xcbeautify --renderer github-actions
      - name: Export the IPA and upload it to App Store Connect
        run: |
          set -o pipefail
          python3 - "$RUNNER_TEMP/sign/profiles.json" <<'PY'
          import json, os, plistlib, sys
          names = json.load(open(sys.argv[1]))
          plistlib.dump({"method": "app-store-connect", "destination": "export", "teamID": os.environ["TEAM"].strip(),
                         "signingStyle": "manual", "signingCertificate": "Apple Distribution",
                         "provisioningProfiles": names, "uploadSymbols": True,
                         "manageAppVersionAndBuildNumber": False}, open("ExportOptions-AppStore.plist", "wb"))
          PY
          xcodebuild -exportArchive -archivePath build/IslamicAzkar.xcarchive \
            -exportOptionsPlist ExportOptions-AppStore.plist -exportPath build/export | xcbeautify --renderer github-actions
          ls -l build/export
          xcrun altool --upload-app --type ios -f build/export/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER" --output-format normal
          echo "Uploaded. It appears in App Store Connect → TestFlight after Apple finishes processing (10-30 min)."
      - name: Remove the temporary certificate and profiles
        if: always()
        run: python3 $GITHUB_WORKSPACE/tools/appstore_signing.py cleanup "$RUNNER_TEMP/sign" || true
