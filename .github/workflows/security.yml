# Security checks: the live website and sync API, and the released Android, iPhone and Mac files.
# Run from the Actions tab, or by changing this file. Read-only, except a few test sync records it
# creates and deletes again.
name: Security

on:
  workflow_dispatch:
  push:
    branches: [main, "main-*"]
    paths: [".github/workflows/security.yml"]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Website and sync API
        run: |
          S=https://islamicazkar.net
          pass() { echo "PASS  $*"; }; fail() { echo "FAIL  $*"; }; info() { echo "INFO  $*"; }
          echo "== Response headers (/)"
          curl -sSI "$S/" | grep -iE "^(strict-transport|content-security|x-frame|x-content-type|referrer-policy|permissions-policy|cross-origin|server|x-powered)" | sed 's/^/      /'
          H=$(curl -sSI "$S/" | tr 'A-Z' 'a-z')
          for h in strict-transport-security content-security-policy x-frame-options permissions-policy x-content-type-options referrer-policy; do
            echo "$H" | grep -q "^$h:" && pass "header $h" || fail "header $h missing"
          done
          echo "== HTTPS"
          L=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://islamicazkar.net/); info "http:// answers $L"
          case "$L" in 30[178]*https://*) pass "http redirects to https";; *) fail "http does not redirect to https";; esac
          for v in tls1 tls1_1; do
            timeout 10 openssl s_client -connect islamicazkar.net:443 -servername islamicazkar.net -$v </dev/null >/dev/null 2>&1 \
              && fail "old $v accepted" || pass "old $v refused"
          done
          timeout 10 openssl s_client -connect islamicazkar.net:443 -servername islamicazkar.net -tls1_3 </dev/null 2>/dev/null | grep -q "TLSv1.3" && pass "TLS 1.3" || info "no TLS 1.3"
          echo | openssl s_client -connect islamicazkar.net:443 -servername islamicazkar.net 2>/dev/null | openssl x509 -noout -issuer -enddate | sed 's/^/      /'
          echo "== Files that must not be served"
          for p in wrangler.toml "functions/sync/%5B%5Bpath%5D%5D.js" _headers .git/config .git/HEAD .env .DS_Store package.json; do
            c=$(curl -s -o /tmp/b -w '%{http_code}' "$S/$p")
            # Pages answers unknown paths with the home page (200 text/html): only a real file is a leak.
            if [ "$c" = 200 ] && ! grep -qi "<html" /tmp/b; then fail "/$p is served ($(head -c 60 /tmp/b | tr '\n' ' '))"; else pass "/$p not served ($c)"; fi
          done
          echo "== Sync API"
          c=$(curl -s -o /dev/null -w '%{http_code}' "$S/sync"); [ "$c" = 405 ] && pass "GET /sync refused (405)" || fail "GET /sync answered $c"
          A=$(curl -s -D - -o /dev/null -X OPTIONS "$S/sync" -H "Origin: https://evil.example" -H "Access-Control-Request-Method: POST" | tr 'A-Z' 'a-z')
          echo "$A" | grep -q "access-control-allow-origin" && fail "CORS allows another website" || pass "CORS refuses another website"
          A=$(curl -s -D - -o /dev/null -X OPTIONS "$S/sync" -H "Origin: https://islamicazkar.net" -H "Access-Control-Request-Method: POST" | tr 'A-Z' 'a-z')
          echo "$A" | grep -q "access-control-allow-origin: https://islamicazkar.net" && pass "CORS allows the site itself" || fail "CORS does not allow the site"
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$S/sync" -H 'content-type: application/json' -d '{bad json'); [ "$c" = 400 ] && pass "bad JSON → 400" || fail "bad JSON → $c"
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$S/sync" -H 'content-type: application/json' -d '{"code":"AAAAAAAAAAAA","days":{}}'); [ "$c" = 404 ] && pass "unknown code → 404" || fail "unknown code → $c"
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$S/sync" -H 'content-type: application/json' -d '{"code":"*","days":{}}'); [ "$c" = 404 ] && pass "malformed code → 404" || fail "malformed code → $c"
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$S/sync/delete" -H 'content-type: application/json' -d '{"code":"AAAAAAAAAAAA"}'); [ "$c" = 404 ] && pass "delete unknown code → 404" || fail "delete unknown → $c"
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$S/sync/../../etc" -H 'content-type: application/json' -d '{}'); info "path traversal → $c"
          # A record only keeps well-formed days and readings (no script, no prototype keys).
          N=$(curl -s -X POST "$S/sync/new" -H 'content-type: application/json' \
            -d '{"days":{"2026-01-01":["morning","<script>alert(1)</script>","c12"],"__proto__":["morning"],"constructor":{"x":1},"2026-13-99x":["evening"]}}')
          echo "      new record: $N"
          CODE=$(echo "$N" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("code",""))' 2>/dev/null)
          echo "$N" | grep -q "script\|__proto__\|constructor\|13-99" && fail "bad input kept" || pass "bad input dropped"
          [ ${#CODE} = 12 ] && pass "code has 12 characters" || fail "code '$CODE'"
          # A large body is refused or trimmed, not stored as is.
          python3 -c 'import json; print(json.dumps({"code":"'"$CODE"'","days":{f"{2000+i//372:04d}-{(i//31)%12+1:02d}-{i%31+1:02d}":["morning"]*100+["c%d"%j for j in range(100)] for i in range(5000)}}))' > /tmp/big.json
          info "large body $(wc -c </tmp/big.json) bytes → $(curl -s -o /tmp/r -w '%{http_code}' -X POST "$S/sync" -H 'content-type: application/json' --data-binary @/tmp/big.json), stored $(python3 -c 'import json; d=json.load(open("/tmp/r")).get("days",{}); print(len(d), "days,", max((len(v) for v in d.values()), default=0), "readings a day max")' 2>/dev/null)"
          echo "== Rate limit on new codes (10 an hour)"
          CODES="$CODE"; got429=0
          for i in $(seq 1 11); do
            R=$(curl -s -w ' %{http_code}' -X POST "$S/sync/new" -H 'content-type: application/json' -d '{}')
            case "$R" in *429) got429=1; break;; esac
            CODES="$CODES $(echo "${R% *}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')"
          done
          [ $got429 = 1 ] && pass "rate limit answers 429" || fail "no rate limit after 11 new codes"
          for c in $CODES; do curl -s -o /dev/null -X POST "$S/sync/delete" -H 'content-type: application/json' -d "{\"code\":\"$c\"}"; done
          info "test records deleted"
          echo "== Code randomness: 200 codes would need 20 hours; the server uses crypto.getRandomValues (see functions/sync)."

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Released APK and AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pass() { echo "PASS  $*"; }; fail() { echo "FAIL  $*"; }; info() { echo "INFO  $*"; }
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'IslamicAzkar.apk' --pattern 'IslamicAzkar-play.aab' -D rel
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/aapt2 dump xmltree rel/IslamicAzkar.apk --file AndroidManifest.xml > m.txt
          grep -q 'debuggable.*0xffffffff' m.txt && fail "APK is debuggable" || pass "APK not debuggable"
          grep -q 'usesCleartextTraffic.*0xffffffff' m.txt && fail "cleartext HTTP allowed" || pass "no cleartext HTTP flag"
          grep -q 'networkSecurityConfig' m.txt && info "has a network security config" || pass "default network security (HTTPS only on Android 9+)"
          grep -q 'allowBackup.*0xffffffff' m.txt && info "allowBackup=true (record and sync code go into Google backup)" || pass "allowBackup off"
          echo "== Exported components"
          python3 - <<'EOF'
          import re
          t=open("m.txt").read()
          for block in re.split(r"\n\s*E: (?=activity|receiver|service|provider)", t)[1:]:
              kind=block.split()[0]; name=re.search(r'android:name.*?="([^"]+)"', block); exp='exported' in block and re.search(r'exported\(0x[0-9a-f]+\)=\(type 0x12\)0xffffffff', block)
              perm=re.search(r'android:permission.*?="([^"]+)"', block)
              if exp: print(f"      exported {kind}: {name.group(1) if name else '?'}" + (f" (needs {perm.group(1)})" if perm else ""))
          EOF
          grep -o 'android.permission.[A-Z_]*' m.txt | sort -u | sed 's/^/      permission /'
          echo "== Signature"
          $BT/apksigner verify --print-certs -v rel/IslamicAzkar.apk | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)|key size|algorithm" | sed 's/^/      /'
          $BT/apksigner verify rel/IslamicAzkar.apk && pass "APK signature valid"
          echo "== Secrets inside the files"
          mkdir x && cd x && unzip -q ../rel/IslamicAzkar.apk && cd ..
          grep -raoE "BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{35}|sk_live_[0-9a-zA-Z]{20,}" x | head && fail "secret-looking strings in the APK" || pass "no keys or tokens in the APK"
          grep -raoE "https?://[a-zA-Z0-9.-]+\.[a-z]{2,}" x/classes*.dex | cut -d: -f2- | sort -u | grep -vE "schemas.android|www.w3.org|apache.org|google.com/|android.com|example" | sed 's/^/      url /'
          grep -raoE "http://[a-zA-Z0-9.-]+\.[a-z]{2,}" x/classes*.dex | grep -vE "schemas.android|www.w3.org|apache.org|ns.adobe|xmlpull|xml.org|example" | sort -u | sed 's/^/      plain http: /'

  apple:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Released iPhone and Mac files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pass() { echo "PASS  $*"; }; fail() { echo "FAIL  $*"; }; info() { echo "INFO  $*"; }
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'IslamicAzkar.ipa' --pattern 'IslamicAzkar.dmg' -D rel
          echo "== iPhone (IPA)"
          mkdir ipa && cd ipa && unzip -q ../rel/IslamicAzkar.ipa && cd ..
          APP=$(ls -d ipa/Payload/*.app)
          plutil -extract NSAppTransportSecurity json -o - "$APP/Info.plist" 2>/dev/null && info "App Transport Security exceptions above" || pass "no App Transport Security exceptions (HTTPS only)"
          plutil -extract CFBundleURLTypes json -o - "$APP/Info.plist" | sed 's/^/      url schemes /'
          codesign -d --entitlements :- "$APP" 2>/dev/null | plutil -convert json -o - - 2>/dev/null | sed 's/^/      entitlements /' || info "IPA not signed for distribution (the App Store build is signed by the upload workflow)"
          for ext in "$APP"/PlugIns/*.appex; do plutil -extract NSAppTransportSecurity json -o - "$ext/Info.plist" >/dev/null 2>&1 && fail "$(basename "$ext") has ATS exceptions" || pass "$(basename "$ext"): no ATS exceptions"; done
          strings -a "$APP"/IslamicAzkar "$APP"/PlugIns/*.appex/* 2>/dev/null | grep -E "BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_|AIza[0-9A-Za-z_-]{35}" | head && fail "secret-looking strings in the iPhone app" || pass "no keys or tokens in the iPhone app"
          strings -a "$APP"/IslamicAzkar | grep -oE "http://[a-zA-Z0-9.-]+\.[a-z]{2,}" | grep -v "apple.com/DTDs\|www.w3.org" | sort -u | sed 's/^/      plain http: /'
          echo "== Mac (DMG)"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/dmg rel/IslamicAzkar.dmg >/dev/null
          MAC=$(ls -d /tmp/dmg/*.app)
          codesign --verify --deep --strict "$MAC" && pass "Mac app signature valid" || fail "Mac app signature invalid"
          codesign -dvv "$MAC" 2>&1 | grep -E "Authority|TeamIdentifier|flags|Runtime" | sed 's/^/      /'
          codesign -dvv "$MAC" 2>&1 | grep -q "runtime" && pass "hardened runtime on" || fail "hardened runtime off"
          spctl --assess --type execute -vv "$MAC" 2>&1 | sed 's/^/      /'
          spctl --assess --type execute "$MAC" 2>/dev/null && pass "Gatekeeper accepts the app" || fail "Gatekeeper rejects the app"
          xcrun stapler validate "$MAC" 2>&1 | tail -1 | sed 's/^/      /'
          codesign -d --entitlements - --xml "$MAC" 2>/dev/null | plutil -convert json -o - - 2>/dev/null | sed 's/^/      entitlements /'
          codesign -d --entitlements - --xml "$MAC" 2>/dev/null | grep -q "get-task-allow\|disable-library-validation\|allow-unsigned-executable-memory\|allow-dyld-environment" && fail "risky Mac entitlement" || pass "no risky Mac entitlements"
          hdiutil detach /tmp/dmg >/dev/null
