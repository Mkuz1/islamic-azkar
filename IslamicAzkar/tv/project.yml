# Apple TV app: the shared data and logic (../ios/Shared, without the widget code) with screens
# made for the Siri Remote (Sources/). Generate the Xcode project with `xcodegen` (done in CI, see
# .github/workflows/tv.yml); the generated IslamicAzkarTV.xcodeproj is not committed.
name: IslamicAzkarTV
options:
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.23"
    CURRENT_PROJECT_VERSION: "23"
targets:
  IslamicAzkar:
    type: application
    platform: tvOS
    sources:
      - path: ../ios/Shared
        excludes: ["WidgetViews.swift", "TasbihIntents.swift"]
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Islamic Azkar
        CFBundleName: Islamic Azkar
        CFBundleLocalizations: [ar, en, fr]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIAppFonts: [Amiri-Regular.ttf, Amiri-Bold.ttf, ArefRuqaa-Bold.ttf, AmiriQuran-Regular.ttf, ReemKufi.ttf, Nastaliq.ttf]
    settings:
      base:
        PRODUCT_NAME: Islamic Azkar
        PRODUCT_BUNDLE_IDENTIFIER: com.koussa.IslamicAzkar
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
